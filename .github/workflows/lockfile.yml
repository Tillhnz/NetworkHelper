name: package-lock.json anlegen

# Einmalig: legt die Sperrdatei für die npm-Pakete an. Damit baut das Frontend immer mit genau geprüften
# Versionen (npm ci), und Dependabot erkennt auch Lücken in indirekten Abhängigkeiten.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "package-lock.json für reproduzierbare, geprüfte Frontend-Builds"
          git push
