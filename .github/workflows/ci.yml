name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Statische Prüfung
        run: ruff check --select F,E9 app tests ../agent ../updater
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Erzeugte nginx-Konfiguration (Länder- und Listen-Sperren) mit echtem nginx prüfen
        run: |
          python ../tools/nginx_selftest.py /tmp/nhconf > /dev/null
          docker run --rm -v /tmp/nhconf:/t:ro nginx:1.27-alpine nginx -t -c /t/nginx.conf
          docker run --rm -v /tmp/nhconf:/t:ro openresty/openresty:alpine openresty -t -c /t/nginx.conf

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: networkhelper
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: networkhelper
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U networkhelper" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (PostgreSQL wie im Betrieb)
        env:
          DATABASE_URL: postgresql+psycopg://networkhelper:ci@localhost:5432/networkhelper
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: Bauen
        run: npm run build

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skripte und Compose-Datei prüfen
        run: |
          bash -n install.sh
          bash -n agent/install.sh
          bash -n proxmox/create-lxc.sh
          python3 -m py_compile agent/nh-agent.py
          POSTGRES_PASSWORD=x SECRET_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx PUBLIC_URL=http://localhost docker compose config -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Images bauen und Stack starten
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)/; s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break; sleep 2; done
          curl -fsS http://localhost:8080/ | grep -q NetworkHelper
          curl -fsS http://localhost:8080/api/agent/files/nh-agent.py | head -3
          curl -fsSI http://localhost:8080/ | grep -qi "frame-ancestors 'none'"
      - name: Einbetten erlauben (Administration → Zugang)
        run: |
          curl -fsSI http://localhost:8080/ | grep -i "x-frame-options: DENY"
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@example.de","password":"ci-geheim-123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -fsS -X PUT http://localhost:8080/api/admin/settings -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"values":{"frame_ancestors":"https://ha.example.de/lovelace http://192.168.1.20:8123"}}' > /dev/null
          curl -fsSI http://localhost:8080/ | tee /tmp/h.txt
          grep -qi "frame-ancestors 'self' https://ha.example.de http://192.168.1.20:8123" /tmp/h.txt
          ! grep -qi "x-frame-options" /tmp/h.txt
          curl -fsSI http://localhost:8080/assets/ 2>/dev/null | grep -qi "frame-ancestors 'none'" || true
          docker compose stop backend
          curl -fsS http://localhost:8080/ | grep -q NetworkHelper   # Seite kommt auch ohne Backend
          curl -fsSI http://localhost:8080/ | grep -i "x-frame-options: DENY"
      - name: Protokolle bei Fehler
        if: failure()
        run: docker compose logs --tail 80
