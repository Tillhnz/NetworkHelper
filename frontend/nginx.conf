# Einbetten (z. B. in Home Assistant): Das Backend nennt die erlaubten Adressen, sonst bleibt es verboten
map $nh_fa_raw $nh_frame_ancestors {
    ""      "'none'";
    default $nh_fa_raw;
}
map $nh_fa_raw $nh_xfo {
    ""      "DENY";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

    # API und Agenten-Schnittstelle an das Backend weiterreichen
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 20m;   # Agenten schicken bis zu 2000 Protokollzeilen auf einmal
        proxy_read_timeout 120s;
    }

    # Abfrage beim Backend, wer einbetten darf (nur intern)
    location = /_frame-policy {
        internal;
        proxy_pass http://backend:8000/api/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Single-Page-App: unbekannte Pfade liefern index.html
    location / {
        auth_request /_frame-policy;
        auth_request_set $nh_fa_raw $upstream_http_x_nh_frame_ancestors;
        include /etc/nginx/snippets/page-headers.conf;
        try_files $uri $uri/ /index.html;
        error_page 500 502 503 504 = @page_strict;  # Backend nicht erreichbar: Seite trotzdem ausliefern, Einbetten verboten
    }

    location @page_strict {
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # Service Worker und Manifest immer frisch laden, damit Updates ankommen
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Kartendaten (Natural Earth): ändern sich nur mit einem Update
    location = /world.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
