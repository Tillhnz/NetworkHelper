# Wird in jeden location-Block eingebunden (add_header wird sonst von Blöcken mit eigenen Headern überschrieben).
# Kachelkarten und Wetter kommen vom Browser aus nur als Bilder (img-src https:); Daten gehen nur an die eigene Adresse.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
